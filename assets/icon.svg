<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e14"/><stop offset="1" stop-color="#0a0b08"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fb5c"/><stop offset="1" stop-color="#c9d61f"/>
    </linearGradient>
    <clipPath id="r"><rect width="512" height="512" rx="104"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- диагональные полосы фона -->
    <g opacity=".07" stroke="#fff" stroke-width="6">
      <path d="M-40 420 L420 -40 M20 480 L480 20 M80 540 L540 80 M140 600 L600 140"/>
    </g>
    <!-- «тень» — смещённый тёмный шеврон -->
    <path d="M256 112 L392 392 L330 392 L256 236 L182 392 L120 392 Z" fill="#000" opacity=".55" transform="translate(18 18)"/>
    <!-- шеврон-ковчег «A» -->
    <path d="M256 112 L392 392 L330 392 L256 236 L182 392 L120 392 Z" fill="url(#lime)"/>
    <!-- ромб-маркер внутри «A» -->
    <path d="M256 304 L280 334 L256 364 L232 334 Z" fill="url(#lime)"/>
    <!-- нижняя акцентная полоса -->
    <path d="M70 440 L442 440 L432 456 L60 456 Z" fill="url(#lime)" opacity=".9"/>
  </g>
</svg>
