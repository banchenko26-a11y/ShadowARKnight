# Собирает EndfieldMenu.exe на серверах GitHub — Node.js у себя ставить не нужно.
# Запускается сам при каждой загрузке в main, или вручную: Actions → "Build EXE" → Run workflow.
# Тег вида v1.0.0 → сборка сама создаст релиз в Releases и прикрепит к нему exe.
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

# Если релиз создан через сайт, приходят сразу два события — лишняя сборка отменяется.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка portable .exe
        run: npm run build

      - name: Скачать exe (вкладка Actions → этот запуск → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EndfieldMenu
          path: dist/*.exe

      - name: Создать релиз и прикрепить exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Endfield Menu ${{ github.ref_name }}
          body: |
            **Компаньон-оверлей для Arknights: Endfield на ПК:** карта, тренер ротаций, таймеры и заметки поверх игры.
            Не чит: в память и файлы игры не лезет и кнопки за вас не нажимает.

            **Как запустить**
            1. Скачайте **EndfieldMenu-*.exe** ниже. Установка и Node.js не нужны.
            2. Если Windows покажет синее окно, нажмите «Подробнее» → «Выполнить в любом случае».
            3. Запустите игру: меню появится поверх неё само, а после выхода из игры закроется.
            4. В игре включите оконный или безрамочный режим.

            **Главные клавиши:** F8 меню · Ctrl+M карта · F5 / F4 ротация · F10 скриншот. Все клавиши переназначаются в меню.
          files: dist/*.exe
