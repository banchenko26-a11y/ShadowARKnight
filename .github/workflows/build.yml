# Собирает EndfieldMenu.exe на серверах GitHub — Node.js у себя ставить не нужно.
# Запускается сам при каждой загрузке в main, или вручную: Actions → "Build EXE" → Run workflow.
# Тег вида v1.0.0 → сборка сама создаст релиз в Releases и прикрепит к нему exe.
name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm install

      - name: Сборка portable .exe
        run: npm run build

      - name: Скачать exe (вкладка Actions → этот запуск → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EndfieldMenu
          path: dist/*.exe

      - name: Создать релиз и прикрепить exe
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Endfield Menu ${{ github.ref_name }}
          body: |
            Скачайте **EndfieldMenu-*.exe** ниже и запустите — установка и Node.js не нужны.
            Если Windows покажет синее окно: «Подробнее» → «Выполнить в любом случае».
            В игре включите оконный или безрамочный режим.
          files: dist/*.exe
