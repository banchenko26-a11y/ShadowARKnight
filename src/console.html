<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ShadowARK — консоль</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0c0c0c; color: #cccccc; }
    body { font: 14px/1.5 Consolas, "Cascadia Mono", "Courier New", monospace; display: flex; flex-direction: column; }
    #out { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; user-select: text; }
    .t { color: #6a6a6a; }
    .title { color: #e6f23a; font-weight: bold; }
    .ok    { color: #4ec94e; }
    .warn  { color: #f2c53a; }
    .hint  { color: #8fa1b3; }
    .wait  { color: #cccccc; }
    .cursor { display: inline-block; width: 8px; height: 15px; background: #cccccc; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #bar { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #222; background: #111; }
    button { font: 12px Consolas, monospace; color: #ccc; background: #1d1d1d; border: 1px solid #333; padding: 5px 10px; cursor: pointer; }
    button:hover { border-color: #e6f23a; color: #fff; }
    #bar span { margin-left: auto; color: #555; font-size: 12px; align-self: center; }
    ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #333; }
  </style>
</head>
<body>
  <div id="out"></div>
  <div id="bar">
    <button id="open">Открыть меню без игры</button>
    <button id="quit">Выход</button>
    <span>окно спрячется, когда игра запустится</span>
  </div>
  <script src="console.js"></script>
</body>
</html>
